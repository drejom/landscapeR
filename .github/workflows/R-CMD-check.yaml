on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

name: R-CMD-check

permissions:
  contents: read
  issues: read

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select package-check path
        id: package-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            python3 scripts/classify-package-check.py --force-full --github-output "$GITHUB_OUTPUT"
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              python3 scripts/classify-package-check.py --stdin-zero --github-output "$GITHUB_OUTPUT"
          fi

      - name: Documentation-only short path
        if: steps.package-check.outputs.run_full != 'true'
        run: echo "Package execution is unchanged; the required check is satisfied without installing R dependencies."

      - uses: r-lib/actions/setup-r@v2
        if: steps.package-check.outputs.run_full == 'true'
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install Bioconductor
        if: steps.package-check.outputs.run_full == 'true'
        run: |
          Rscript -e 'install.packages("BiocManager"); BiocManager::install(version = "3.22", ask = FALSE)'

      - uses: r-lib/actions/setup-r-dependencies@v2
        if: steps.package-check.outputs.run_full == 'true'
        with:
          extra-packages: |
            any::rcmdcheck
            any::devtools
            any::testthat
            any::pkgdown

      - name: Check
        if: steps.package-check.outputs.run_full == 'true'
        run: rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "warning")
        shell: Rscript {0}

      - name: Build pkgdown site
        if: steps.package-check.outputs.run_full == 'true'
        run: bash scripts/build-pkgdown-site.sh

      - name: Check pkgdown article images
        if: steps.package-check.outputs.run_full == 'true'
        run: |
          python3 scripts/check-pkgdown-images.py --site-root .scratch/site .scratch/site/articles/development-log.html
          python3 scripts/check-pkgdown-images.py --site-root .scratch/site .scratch/site/articles/stage1-evidence.html

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Roadmap integrity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number > /tmp/open-issues.json
          python3 scripts/check-roadmap.py --open-issues-json /tmp/open-issues.json

      - name: ADR coverage
        run: python3 scripts/check-adr-coverage.py

      - name: ADR governance
        run: python3 scripts/check-adr-governance.py

      - name: Registry compliance
        run: bash scripts/check-registry-compliance.sh

      - name: Visual landing-proof policy tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Visual landing-proof policy
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          python3 scripts/check-figure-review.py /tmp/pr_body.txt --expected-commit "$PR_HEAD_SHA"

      - name: Review ratchet document
        run: python3 scripts/check-review-ratchet.py

      - name: Review ratchet pull-request disposition
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          python3 scripts/check-review-ratchet.py --pr-body /tmp/pr_body.txt

      - name: Repository hygiene
        run: bash scripts/check-repo-hygiene.sh

  pkgdown:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [R-CMD-check, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true

      - name: Install Bioconductor
        run: |
          Rscript -e 'install.packages("BiocManager"); BiocManager::install(version = "3.22", ask = FALSE)'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown

      - name: Build pkgdown site
        run: bash scripts/build-pkgdown-site.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .scratch/site

      - id: deployment
        uses: actions/deploy-pages@v4
